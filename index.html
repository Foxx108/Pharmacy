<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MediCare Station</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0f766e;--gd:#115e56;--gl:#e6f4f1;--line:#c4e3dd;--bg:#f7fbfa;--ink:#10302c;--soft:#4a6b66;--am:#b45309;--amb:#fef4e6;--ro:#9f1239;--rob:#fdf0f3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink)}
input[type=file]{border:0;padding:0}
.hide{display:none!important}.soft{color:var(--soft);font-size:13px}.empty{text-align:center;color:var(--soft);padding:26px 0}.clk{cursor:pointer}.clk:hover{color:var(--g)}
.shell{display:flex;min-height:100vh}
.side{width:240px;flex-shrink:0;background:var(--g);color:#d7efea;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.16);margin-bottom:14px}.brand b{display:block;color:#fff;font-size:17px}.brand span{font-size:12.5px;color:#9fd3ca}
.nb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#cfe9e4;padding:10px 12px;border-radius:9px;margin-bottom:2px;text-align:left;position:relative}
.nb:hover{background:rgba(255,255,255,.1)}.nb.on{background:#fff;color:var(--g);font-weight:600}.ic{font-size:18px}
.bd{margin-left:auto;background:#fbbf24;color:#422006;font-size:11.5px;font-weight:700;border-radius:99px;padding:0 7px}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.16);font-size:12.5px}.who b{display:block;color:#fff;font-size:14px}
.main{flex:1;min-width:0;padding:28px 32px 50px;max-width:1080px}.mtop{display:none}
h2{font-size:22px}.sub{color:var(--soft);font-size:14px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.btn{background:var(--g);color:#fff;border:0;padding:9px 16px;border-radius:9px;font-weight:600}.btn:hover{background:var(--gd)}.btn:disabled{opacity:.5}
.btn.gh{background:none;border:1px solid var(--line);color:var(--g)}.btn.no{background:none;border:1px solid #e9c4cf;color:var(--ro)}.btn.sm{padding:5px 11px;font-size:13.5px}
label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin-bottom:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px}.ok{background:var(--gl);color:var(--g)}.wait{background:var(--amb);color:var(--am)}.bad{background:var(--rob);color:var(--ro)}
.row{display:flex;align-items:center;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}.stat b{display:block;font-size:26px;line-height:1.2}
.cols{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}.cartpanel{position:sticky;top:20px}
.flt{display:flex;gap:10px;margin-bottom:14px}.flt select{width:170px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mc{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.im{position:relative;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc .im{height:110px;cursor:pointer}.thumb{width:52px;height:52px;border-radius:10px;flex-shrink:0;font-size:22px;cursor:pointer}
.cr{padding:8px 0;border-bottom:1px solid #edf5f3;font-size:14px}.cr input{width:70px;text-align:center}
.fab{display:none;position:fixed;right:16px;bottom:84px;background:var(--g);color:#fff;border:0;border-radius:99px;padding:12px 20px;font-weight:600;box-shadow:0 6px 20px rgba(15,118,110,.4);z-index:40;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;z-index:999;box-shadow:0 6px 24px rgba(16,48,44,.3);max-width:90vw;text-align:center}.toast.er{background:var(--ro)}
.mw{position:fixed;inset:0;background:rgba(16,48,44,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.mcard{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;position:relative}
.mx{position:absolute;top:10px;right:12px;background:none;border:0;font-size:24px;color:var(--soft);line-height:1}
.mrow{padding:9px 0;border-bottom:1px solid #edf5f3}.mrow .soft{font-weight:600}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .f{grid-column:1/-1}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gb{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 26px;box-shadow:0 10px 40px rgba(15,118,110,.1)}.gb h1{font-size:21px;text-align:center}
.rt{display:flex;gap:8px;margin:18px 0}.rt button{flex:1;padding:10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--soft);font-weight:600}.rt button.on{background:var(--g);border-color:var(--g);color:#fff}
.fld{margin-bottom:14px}.ge{color:var(--ro);font-size:13.5px;min-height:1.4em;margin-bottom:6px}
@media(max-width:860px){
.side{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -4px 16px rgba(16,48,44,.15)}
.brand,.who{display:none}#nav{display:flex;width:100%}
.nb{flex-direction:column;flex:1;gap:0;padding:6px 0;font-size:11px;align-items:center;justify-content:center;margin:0}
.nb .bd{position:absolute;top:0;right:14%;margin:0;font-size:10px}
.mtop{display:flex;align-items:center;justify-content:space-between;background:var(--g);color:#fff;padding:12px 16px;font-weight:600}
.mtop button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:5px 12px;font-size:13px}
.main{padding:16px 14px 100px}.cols{grid-template-columns:1fr}.cartpanel{display:none}.fab{display:flex}
.g4{grid-template-columns:1fr 1fr}.mg{grid-template-columns:1fr 1fr}
}
</style></head><body>

<div id="gate" class="gate"><div class="gb">
<h1>💊 MediCare Station</h1><p class="soft" style="text-align:center">ระบบเบิกจ่ายยาสามัญ ห้องพยาบาล</p>
<div class="rt"><button id="t_student" class="on" onclick="setRole('student')">นักศึกษา</button><button id="t_staff" onclick="setRole('staff')">เจ้าหน้าที่</button></div>
<div class="fld"><label>ชื่อ-นามสกุล</label><input type="text" id="gn" placeholder="กรอกชื่อของคุณ" onkeydown="if(event.key=='Enter')enter()"></div>
<div class="fld hide" id="cf"><label>รหัสเจ้าหน้าที่</label><input type="password" id="gc" placeholder="กรอกรหัสผ่าน" onkeydown="if(event.key=='Enter')enter()"></div>
<div class="ge" id="ge"></div><button class="btn" style="width:100%" id="eb" onclick="enter()">เข้าสู่ระบบ</button>
</div></div>

<div id="app" class="hide">
<div class="mtop"><span>💊 MediCare · <span id="mun"></span></span><button onclick="location.reload()">ออกจากระบบ</button></div>
<div class="shell">
<aside class="side"><div class="brand"><b>💊 MediCare Station</b><span>ระบบเบิกจ่ายยาสามัญ</span></div>
<nav id="nav"></nav>
<div class="who"><b id="un"></b><span id="ur"></span><button class="nb" style="margin-top:8px;padding:6px 10px;font-size:13px" onclick="location.reload()">↺ ออกจากระบบ</button></div></aside>
<main class="main"><h2 id="pt"></h2><p class="sub" id="ps"></p><div id="view"></div></main>
</div></div>
<div id="mr"></div>

<script>
var API='https://script.google.com/macros/s/AKfycbzlr9yyk_BD2uyaSNmPGSLNPNP3Q6jRAqI1NK6tPihk5oH3RWqJzT2saNhbAEqxRoFrCA/exec';
var S={user:null,meds:[],reqs:[],page:'',cart:{},symptom:'',q:'',cat:'ทั้งหมด'},AUTH={name:'',role:'student',code:''},busy=false,V={};
var $=function(i){return document.getElementById(i)};
async function api(a,d){var r=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({action:a},d||{}))});var j=await r.json();if(!j.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');return j.data}
function errm(e){return e.message==='Failed to fetch'?'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้':e.message}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m,er){var t=document.createElement('div');t.className='toast'+(er?' er':'');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3000)}
function oc(f,id){return 'onclick="'+f+"('"+esc(id)+"')\""}
function medOf(id){return S.meds.filter(function(m){return m.id===id})[0]}
function img(m){return(m.image_url?'<img loading="lazy" src="'+esc(m.image_url)+'" onerror="this.remove()">':'')+'💊'}
function tg(s){return s=='approved'?'<span class="tag ok">จ่ายยาแล้ว</span>':s=='rejected'?'<span class="tag bad">ปฏิเสธ</span>':'<span class="tag wait">รออนุมัติ</span>'}
function its(a){return a.map(function(i){return esc(i.name)+' × '+i.qty}).join(', ')}
var PG={student:[['meds','💊','เบิกยา','เลือกยาแล้วส่งคำขอให้เจ้าหน้าที่'],['mine','📋','คำขอของฉัน','ติดตามสถานะคำขอที่ส่งไปแล้ว']],
staff:[['dash','🏠','หน้าแรก','สรุปภาพรวมวันนี้'],['pending','📋','คำขอ','ตรวจสอบและอนุมัติการจ่ายยา'],['stock','📦','คลังยา','จำนวนคงเหลือ เติมสต็อก และแก้ไขข้อมูลยา'],['hist','🕘','ประวัติ','รายการย้อนหลังทั้งหมด']]};

/* ---- login ---- */
function setRole(r){AUTH.role=r;$('t_student').classList.toggle('on',r=='student');$('t_staff').classList.toggle('on',r=='staff');$('cf').classList.toggle('hide',r!='staff');$('ge').textContent=''}
async function enter(){
 var n=$('gn').value.trim(),c=$('gc').value.trim(),e=$('ge');e.textContent='';
 if(!n){e.textContent='กรุณากรอกชื่อ-นามสกุล';return}
 if(AUTH.role=='staff'&&!c){e.textContent='กรุณากรอกรหัสเจ้าหน้าที่';return}
 AUTH.name=n;AUTH.code=AUTH.role=='staff'?c:'';
 var b=$('eb');b.disabled=true;b.textContent='กำลังตรวจสอบ…';
 try{var d=await api('login',{name:n,role:AUTH.role,code:AUTH.code});
  S.user=d.user;S.meds=d.medicines;S.reqs=d.requests;S.page=PG[AUTH.role][0][0];
  $('gate').classList.add('hide');$('app').classList.remove('hide');
  $('un').textContent=n;$('mun').textContent=n;$('ur').textContent=AUTH.role=='staff'?'เจ้าหน้าที่พยาบาล':'นักศึกษา';render()}
 catch(x){e.textContent=errm(x)}
 b.disabled=false;b.textContent='เข้าสู่ระบบ';
}
async function reload(){var d=await api('refresh',{name:AUTH.name,role:AUTH.role,code:AUTH.code});S.meds=d.medicines;S.reqs=d.requests;render()}
async function act(a,d,msg,after){if(busy)return;busy=true;try{await api(a,d);await reload();toast(msg);if(after)after()}catch(e){toast(errm(e),1)}busy=false}
function go(p){S.page=p;render();scrollTo(0,0);reload().catch(function(){})}

/* ---- layout ---- */
function render(){
 var L=PG[AUTH.role],p=L.filter(function(x){return x[0]==S.page})[0]||L[0],pc=S.reqs.filter(function(r){return r.status=='pending'}).length;
 $('nav').innerHTML=L.map(function(x){return '<button class="nb'+(S.page==x[0]?' on':'')+'" '+"onclick=\"go('"+x[0]+"')\""+'><span class="ic">'+x[1]+'</span><span>'+x[2]+'</span>'+(x[0]=='pending'&&pc?'<span class="bd">'+pc+'</span>':'')+'</button>'}).join('');
 $('pt').textContent=p[2];$('ps').textContent=p[3];$('view').innerHTML=V[p[0]]();
 if(p[0]=='meds')drawMeds();cartUpd();
}
function modal(h){$('mr').innerHTML='<div class="mw" onclick="if(event.target==this)closeM()"><div class="mcard"><button class="mx" onclick="closeM()">×</button>'+h+'</div></div>'}
function closeM(){$('mr').innerHTML=''}

/* ---- student: medicines + cart ---- */
V.meds=function(){var cats=['ทั้งหมด'];S.meds.forEach(function(m){if(m.category&&cats.indexOf(m.category)<0)cats.push(m.category)});
 return '<div class="cols"><div><div class="flt"><input type="text" placeholder="ค้นหาชื่อยาหรืออาการ" value="'+esc(S.q)+'" oninput="S.q=this.value;drawMeds()"><select onchange="S.cat=this.value;drawMeds()">'+cats.map(function(c){return '<option'+(c==S.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div><div id="ml" class="mg"></div></div><div class="card cartpanel" id="cartbox"></div></div><button class="fab" onclick="openCart()">🛒 <span id="fabn"></span></button>'};
function drawMeds(){var q=S.q.toLowerCase();
 var l=S.meds.filter(function(m){return(S.cat=='ทั้งหมด'||m.category==S.cat)&&(!q||(m.name+m.category+m.symptoms+m.note).toLowerCase().indexOf(q)>=0)});
 $('ml').innerHTML=l.length?l.map(function(m){return '<div class="mc"><div class="im" '+oc('detail',m.id)+'>'+img(m)+'</div><div style="padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:3px"><b class="clk" '+oc('detail',m.id)+'>'+esc(m.name)+'</b><span class="soft">'+esc(m.symptoms||m.category)+'</span><div class="row" style="margin-top:auto;padding-top:6px;justify-content:space-between"><span class="soft">เหลือ '+m.stock+' '+esc(m.unit)+'</span>'+(m.stock>0?'<button class="btn sm" '+oc('addCart',m.id)+'>เพิ่ม</button>':'<span class="tag bad">หมด</span>')+'</div></div></div>'}).join(''):'<div class="empty" style="grid-column:1/-1">ไม่พบรายการยา</div>'}
function cartHtml(){var ids=Object.keys(S.cart),h='<b>🛒 คำขอเบิกยา</b>';
 if(!ids.length)return h+'<div class="empty">ยังไม่ได้เลือกยา<br>กด “เพิ่ม” จากรายการยา</div>';
 h+=ids.map(function(id){var m=medOf(id);return '<div class="row cr"><span style="flex:1">'+esc(m.name)+'</span><input type="number" min="1" max="'+m.stock+'" value="'+S.cart[id]+'" onchange="setQty(\''+id+'\',this.value)"><button class="btn sm no" '+oc('delCart',id)+'>ลบ</button></div>'}).join('');
 return h+'<div style="margin:12px 0 4px"><label>อาการ</label><textarea rows="3" placeholder="เช่น ปวดหัว มีไข้ตั้งแต่เมื่อคืน" oninput="S.symptom=this.value">'+esc(S.symptom)+'</textarea></div><button class="btn" style="width:100%;margin-top:8px" onclick="send()">ส่งคำขอเบิกยา</button>'}
function cartUpd(){var b=$('cartbox');if(b)b.innerHTML=cartHtml();var n=Object.keys(S.cart).length,f=$('fabn');if(f)f.textContent=n?n+' รายการ':'ตะกร้า';var c=$('cartm');if(c)c.innerHTML=cartHtml()}
function openCart(){modal('<div id="cartm">'+cartHtml()+'</div>')}
function addCart(id){if(!S.cart[id])S.cart[id]=1;cartUpd();toast('เพิ่มลงคำขอแล้ว')}
function setQty(id,v){var m=medOf(id);S.cart[id]=Math.max(1,Math.min(Number(v)||1,m.stock));cartUpd()}
function delCart(id){delete S.cart[id];cartUpd()}
function send(){var items=Object.keys(S.cart).map(function(id){return{med_id:id,qty:S.cart[id]}});
 if(!items.length)return toast('ยังไม่ได้เลือกยา',1);if(!S.symptom.trim())return toast('กรุณาระบุอาการ',1);
 act('submitRequest',{payload:{name:AUTH.name,symptom:S.symptom,items:items}},'ส่งคำขอแล้ว',function(){S.cart={};S.symptom='';closeM();go('mine')})}
V.mine=function(){return S.reqs.length?S.reqs.map(function(r){return '<div class="card"><div class="row"><b>'+esc(r.req_id)+'</b><span class="soft">'+esc(r.timestamp)+'</span><span style="margin-left:auto">'+tg(r.status)+'</span></div><div style="margin-top:6px">'+its(r.items)+'</div>'+(r.symptom?'<div class="soft">อาการ: '+esc(r.symptom)+'</div>':'')+'</div>'}).join(''):'<div class="card empty">ยังไม่มีคำขอ<br>ไปที่หน้า “เบิกยา” เพื่อเริ่มต้น</div>'};

/* ---- detail modal ---- */
function detail(id){var m=medOf(id);if(!m)return;
 function r(l,v){return v?'<div class="mrow"><div class="soft">'+l+'</div>'+esc(v)+'</div>':''}
 modal('<div class="im" style="height:170px;border-radius:10px;margin-bottom:12px;font-size:48px">'+img(m)+'</div><b style="font-size:18px">'+esc(m.name)+'</b><div class="soft">'+esc(m.category)+' · คงเหลือ '+m.stock+' '+esc(m.unit)+'</div><div style="margin-top:8px">'+r('อาการที่ใช้รักษา',m.symptoms)+r('วิธีและเวลารับประทาน',m.dosage)+r('ข้อควรระวัง',m.precautions)+r('หมายเหตุ',m.note)+'</div>'
 +(AUTH.role=='staff'?'<button class="btn gh" style="width:100%;margin-top:14px" '+oc('medForm',m.id)+'>แก้ไขข้อมูล / เปลี่ยนรูป</button>':(m.stock>0?'<button class="btn" style="width:100%;margin-top:14px" onclick="addCart(\''+esc(m.id)+'\');closeM()">เพิ่มลงคำขอ</button>':'')))}

/* ---- staff ---- */
V.dash=function(){var t=new Date(),p=function(n){return('0'+n).slice(-2)},td=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());
 var pend=S.reqs.filter(function(r){return r.status=='pending'}).length,today=S.reqs.filter(function(r){return String(r.timestamp).indexOf(td)==0}).length,ap=S.reqs.filter(function(r){return r.status=='approved'}).length,low=S.meds.filter(function(m){return m.stock<=m.min_stock});
 function st(n,l){return '<div class="stat"><b>'+n+'</b><span class="soft">'+l+'</span></div>'}
 var h='<div class="g4">'+st(pend,'รออนุมัติ')+st(today,'คำขอวันนี้')+st(ap,'จ่ายยาแล้วสะสม')+st(low.length,'ยาใกล้หมด')+'</div>';
 if(low.length)h+='<div class="card" style="background:var(--amb);border-color:#f0d9b5"><b style="color:var(--am)">⚠️ ยาที่ควรเติมสต็อก</b>'+low.map(function(m){return '<div style="padding:4px 0">'+esc(m.name)+' — เหลือ <b>'+m.stock+' '+esc(m.unit)+'</b> <span class="soft">(ขั้นต่ำ '+m.min_stock+')</span></div>'}).join('')+'</div>';
 return h+'<div class="card"><b>คำขอล่าสุด</b>'+(S.reqs.length?S.reqs.slice(0,6).map(function(r){return '<div class="row cr"><div style="flex:1"><b>'+esc(r.student_name)+'</b><div class="soft">'+esc(r.timestamp)+' · '+its(r.items)+'</div></div>'+tg(r.status)+'</div>'}).join(''):'<div class="empty">ยังไม่มีคำขอ</div>')+'</div>'};
V.pending=function(){var l=S.reqs.filter(function(r){return r.status=='pending'});if(!l.length)return '<div class="card empty">ไม่มีคำขอค้างอยู่ 🎉</div>';
 return l.map(function(r){return '<div class="card"><div class="row" style="flex-wrap:wrap"><div style="flex:1"><b>'+esc(r.student_name)+'</b><div class="soft">'+esc(r.req_id)+' · '+esc(r.timestamp)+'</div></div><button class="btn no sm" onclick="decide(\''+esc(r.req_id)+'\',\'rejected\')">ปฏิเสธ</button><button class="btn sm" onclick="decide(\''+esc(r.req_id)+'\',\'approved\')">อนุมัติและจ่ายยา</button></div><div style="margin-top:10px;padding-top:10px;border-top:1px solid #edf5f3">'
 +r.items.map(function(i){var m=medOf(i.med_id);return '<div>'+esc(i.name)+' × <b>'+i.qty+'</b>'+(m?' <span class="soft">(คลังเหลือ '+m.stock+')</span>':'')+(m&&i.qty>m.stock?' <span class="tag bad">สต็อกไม่พอ</span>':'')+'</div>'}).join('')+(r.symptom?'<div class="soft" style="margin-top:6px">อาการ: '+esc(r.symptom)+'</div>':'')+'</div></div>'}).join('')};
function decide(id,d){if(!confirm(d=='approved'?'ยืนยันอนุมัติและตัดสต็อกตามคำขอนี้?':'ยืนยันปฏิเสธคำขอนี้?'))return;
 act('decideRequest',{reqId:id,decision:d,staffName:AUTH.name,code:AUTH.code},d=='approved'?'อนุมัติและตัดสต็อกแล้ว':'ปฏิเสธคำขอแล้ว')}
V.stock=function(){return '<div style="text-align:right;margin-bottom:12px"><button class="btn" onclick="medForm()">+ เพิ่มยาชนิดใหม่</button></div>'+S.meds.map(function(m){var low=m.stock<=m.min_stock;
 return '<div class="card row" style="flex-wrap:wrap"><div class="im thumb" '+oc('detail',m.id)+'>'+img(m)+'</div><div style="flex:1;min-width:150px"><b class="clk" '+oc('detail',m.id)+'>'+esc(m.name)+'</b><div class="soft">'+esc(m.category)+' · เหลือ <b>'+m.stock+'</b> '+esc(m.unit)+' (ขั้นต่ำ '+m.min_stock+') '+(low?'<span class="tag wait">ใกล้หมด</span>':'')+'</div></div><div class="row" style="gap:6px"><input type="number" min="1" id="rs_'+esc(m.id)+'" placeholder="จำนวน" style="width:90px"><button class="btn sm gh" '+oc('restock',m.id)+'>เติม</button></div></div>'}).join('')};
function restock(id){var n=Number($('rs_'+id).value);if(!n||n<=0)return toast('ใส่จำนวนที่จะเติมก่อน',1);act('restock',{medId:id,qty:n,staffName:AUTH.name,code:AUTH.code},'เติมสต็อกแล้ว')}
V.hist=function(){var l=S.reqs.filter(function(r){return r.status!='pending'});if(!l.length)return '<div class="card empty">ยังไม่มีประวัติการจ่ายยา</div>';
 return l.map(function(r){return '<div class="card"><div class="row"><b>'+esc(r.student_name)+'</b><span class="soft">'+esc(r.req_id)+'</span><span style="margin-left:auto">'+tg(r.status)+'</span></div><div style="margin-top:4px">'+its(r.items)+'</div><div class="soft">'+esc(r.timestamp)+(r.approved_by?' · โดย '+esc(r.approved_by):'')+'</div></div>'}).join('')};

/* ---- add / edit medicine ---- */
function medForm(id){var m=id?medOf(id):{};
 function f(k,l,v){return '<div><label>'+l+'</label><input type="text" id="mf_'+k+'" value="'+esc(v)+'"></div>'}
 function t(k,l,v){return '<div class="f"><label>'+l+'</label><textarea rows="2" id="mf_'+k+'">'+esc(v)+'</textarea></div>'}
 modal('<b style="font-size:18px">'+(id?'แก้ไข: '+esc(m.name):'เพิ่มยาชนิดใหม่')+'</b><div class="ge" id="mfe"></div><div class="fg">'+f('name','ชื่อยา',m.name)+f('category','หมวด',m.category)+f('unit','หน่วยนับ (เม็ด/ซอง)',m.unit)+f('min_stock','สต็อกขั้นต่ำ',m.min_stock)+(id?'':f('stock','จำนวนเริ่มต้น',0))+t('symptoms','อาการที่ใช้รักษา',m.symptoms)+t('dosage','วิธีและเวลารับประทาน',m.dosage)+t('precautions','ข้อควรระวัง',m.precautions)+t('note','หมายเหตุ',m.note)
 +'<div class="f"><label>รูปภาพยา</label><div class="im" id="mf_prev" style="height:120px;border-radius:10px;margin-bottom:8px">'+img(m)+'</div><input type="hidden" id="mf_img" value="'+esc(m.image_url)+'"><input type="file" accept="image/*" onchange="pickImg(this)"><div class="soft" id="mf_st"></div></div></div><button class="btn" style="width:100%;margin-top:14px" onclick="saveMed(\''+esc(id||'')+'\')">บันทึก</button>')}
function pickImg(inp){var f=inp.files[0];if(!f)return;var st=$('mf_st');st.textContent='กำลังอัปโหลด…';var rd=new FileReader();
 rd.onload=function(){var im=new Image();im.onload=async function(){var s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  try{var r=await api('uploadImage',{base64:c.toDataURL('image/jpeg',.8).split(',')[1],mime:'image/jpeg',filename:f.name,staffName:AUTH.name,code:AUTH.code});$('mf_img').value=r.url;$('mf_prev').innerHTML='<img src="'+esc(r.url)+'">💊';st.textContent='อัปโหลดสำเร็จ (กดบันทึกด้วย)'}catch(e){st.textContent='อัปโหลดไม่สำเร็จ: '+errm(e)}};im.src=rd.result};rd.readAsDataURL(f)}
function saveMed(id){var g=function(k){return $('mf_'+k).value.trim()},p={name:g('name'),category:g('category'),unit:g('unit'),min_stock:g('min_stock'),symptoms:g('symptoms'),dosage:g('dosage'),precautions:g('precautions'),note:g('note'),image_url:$('mf_img').value};
 if(!p.name){$('mfe').textContent='กรุณากรอกชื่อยา';return}
 if(id)act('updateMedicine',{medId:id,payload:p,staffName:AUTH.name,code:AUTH.code},'บันทึกแล้ว',closeM);
 else{p.stock=g('stock');act('addMedicine',{payload:p,staffName:AUTH.name,code:AUTH.code},'เพิ่มยาแล้ว',closeM)}}
</script></body></html>
