<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MediCare Station</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&display=swap');

  :root {
    --bg-top:     #FFF8F3;
    --bg-bottom:  #FDEADF;
    --surface:    #FFFFFF;
    --coral:      #FF7A59;
    --coral-soft: #FFE3D9;
    --mint:       #2FB693;
    --mint-soft:  #DFF5EE;
    --amber:      #FFB020;
    --amber-soft: #FFF1D6;
    --ink:        #1E2430;
    --grey:       #8C90A4;
    --line:       #F0E7E0;
    --chip-bg:    #F7F7FA;
    --track:      #F1F1F5;
    --shadow: 0 10px 24px -8px rgba(226,167,143,.35);
    --shadow-nav: 0 12px 26px -6px rgba(217,167,143,.4);
  }

  html[data-theme="dark"] {
    --bg-top:     #14110E;
    --bg-bottom:  #1D1712;
    --surface:    #241F1A;
    --coral:      #FF8A67;
    --coral-soft: #3D2A21;
    --mint:       #45D1A6;
    --mint-soft:  #163229;
    --amber:      #FFC24D;
    --amber-soft: #3B2F14;
    --ink:        #F3EEE7;
    --grey:       #A79E90;
    --line:       #35302A;
    --chip-bg:    #2B2620;
    --track:      #322C25;
    --shadow: 0 10px 24px -8px rgba(0,0,0,.55);
    --shadow-nav: 0 12px 26px -6px rgba(0,0,0,.6);
  }

  * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: 'IBM Plex Sans Thai', sans-serif; color: var(--ink); }
  body { overflow: hidden; background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom)); transition: background .25s; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; }
  svg.ico { display: block; }
  input { font-family: inherit; }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  .theme-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--ink); transition: background .25s, transform .12s; }
  .theme-btn:active { transform: scale(.9); }
  .theme-btn svg { width: 19px; height: 19px; }
  .screen-topbar { position: absolute; top: 20px; right: 20px; }

  /* ── LOGIN ── */
  #screen-login { align-items: center; justify-content: center; padding: 32px; }
  .login-box { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .login-logo { width: 84px; height: 84px; border-radius: 28px; background: var(--mint-soft); color: var(--mint); display: flex; align-items: center; justify-content: center; }
  .login-logo svg { width: 40px; height: 40px; }
  .login-title { font-size: 21px; font-weight: 800; text-align: center; }
  .login-sub { font-size: 12.5px; color: var(--grey); text-align: center; margin-top: -12px; }
  .login-fields { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .field-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .field-box svg { width: 18px; height: 18px; color: var(--grey); flex-shrink: 0; }
  .field-box input { border: none; outline: none; font-size: 14px; flex: 1; background: transparent; color: var(--ink); }
  .field-box input::placeholder { color: var(--grey); }
  .field-eye { color: var(--grey); flex-shrink: 0; }
  .field-eye svg { width: 18px; height: 18px; }
  .login-role-row { display: flex; gap: 10px; width: 100%; }
  .role-toggle { flex: 1; padding: 10px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-size: 12.5px; font-weight: 700; color: var(--grey); }
  .role-toggle.active { background: var(--ink); color: var(--bg-top); box-shadow: none; }
  .login-btn { width: 100%; background: var(--coral); color: #fff; padding: 15px; border-radius: 16px; font-size: 14.5px; font-weight: 700; box-shadow: var(--shadow); }
  .login-error { font-size: 12px; color: var(--coral); text-align: center; min-height: 16px; }
  .login-hint { font-size: 11px; color: var(--grey); text-align: center; }

  .page { display: none; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 20px 130px; }
  .page.active { display: block; }

  /* ── HEADER ── */
  .header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .header-badge { width: 48px; height: 48px; border-radius: 16px; background: var(--mint-soft); color: var(--mint); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-badge svg { width: 24px; height: 24px; }
  .header-badge.coral { background: var(--coral-soft); color: var(--coral); }
  .header-greet { font-size: 12px; color: var(--grey); }
  .header-title { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .bell-wrap { position: relative; width: 44px; height: 44px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bell-wrap svg { width: 20px; height: 20px; }
  .bell-dot { position: absolute; right: 12px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }

  /* ── SEARCH ── */
  .search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 18px; padding: 15px 16px; box-shadow: var(--shadow); }
  .search-box svg { width: 18px; height: 18px; color: var(--grey); flex-shrink: 0; }
  .search-box input { border: none; outline: none; font-size: 14px; flex: 1; background: transparent; color: var(--ink); }
  .search-box input::placeholder { color: var(--grey); }

  /* ── PROMO CARD ── */
  .promo-card { margin-top: 20px; padding: 20px; border-radius: 26px; background: linear-gradient(135deg,#FFD9CC,#FFE9D6); box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; color: #2A1C10; }
  .promo-card.mint { background: linear-gradient(135deg,#D6F3E8,#EAFBF3); }
  .promo-text { flex: 1; }
  .promo-pill { display: inline-block; font-size: 11px; font-weight: 600; color: var(--coral); background: rgba(255,255,255,.75); padding: 4px 10px; border-radius: 30px; margin-bottom: 12px; }
  .promo-pill.mint { color: var(--mint); }
  .promo-title { font-size: 19px; line-height: 1.3; font-weight: 800; }
  .promo-sub { font-size: 12px; color: #6b5a4a; margin-top: 6px; }
  .promo-btn { margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; background: var(--coral); color: #fff; padding: 12px 18px; border-radius: 30px; font-size: 13px; font-weight: 700; }
  .promo-btn.mint { background: var(--mint); }
  .promo-btn svg { width: 15px; height: 15px; }
  .promo-icon-box { width: 84px; height: 84px; border-radius: 28px; background: rgba(255,255,255,.6); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--coral); }
  .promo-icon-box.mint { color: var(--mint); }
  .promo-icon-box svg { width: 40px; height: 40px; }

  /* ── SUMMARY CARD (staff) ── */
  .summary-card { margin-top: 18px; padding: 20px; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow); }
  .summary-top { display: flex; align-items: center; }
  .summary-top-label { font-size: 13px; color: var(--grey); }
  .summary-badge { margin-left: auto; font-size: 11px; font-weight: 700; color: #B07400; background: var(--amber-soft); padding: 5px 10px; border-radius: 30px; display: flex; align-items: center; gap: 5px; }
  .summary-badge svg { width: 12px; height: 12px; }
  .summary-value { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; }
  .summary-value b { font-size: 36px; font-weight: 800; }
  .summary-value span { font-size: 13px; color: var(--grey); }
  .action-row { display: flex; gap: 10px; margin-top: 18px; }
  .action-chip { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; background: var(--chip-bg); color: var(--ink); }
  .action-chip svg { width: 20px; height: 20px; }
  .action-chip span { font-size: 12px; font-weight: 600; }
  .divider { height: 1px; background: var(--line); margin: 18px 0 14px; }
  .mini-stats { display: flex; gap: 12px; }
  .mini-stat { flex: 1; display: flex; align-items: center; gap: 10px; }
  .mini-icon { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mini-icon svg { width: 17px; height: 17px; }
  .mini-icon.mint  { background: rgba(47,182,147,.15); color: var(--mint); }
  .mini-icon.coral { background: rgba(255,122,89,.15); color: var(--coral); }
  .mini-title { font-size: 11px; color: var(--grey); }
  .mini-value { font-size: 13px; font-weight: 700; }

  /* ── SECTION TITLE ── */
  .section-row { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 14px; }
  .section-title { font-size: 17px; font-weight: 800; }
  .section-action { font-size: 12px; font-weight: 600; color: var(--coral); }

  /* ── CATEGORY ROW ── */
  .category-row { display: flex; justify-content: space-between; gap: 6px; }
  .category-item { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .category-icon { width: 58px; height: 58px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
  .category-icon svg { width: 24px; height: 24px; }
  .category-label { font-size: 10.5px; font-weight: 600; text-align: center; }

  /* ── MEDICINE CARD (staff, stock page) ── */
  .med-card { background: var(--surface); border-radius: 24px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; cursor: pointer; border: 1.2px solid transparent; }
  .med-card.low { border-color: rgba(255,176,32,.45); }
  .med-top { display: flex; align-items: center; gap: 14px; }
  .med-icon { width: 52px; height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .med-icon svg { width: 24px; height: 24px; }
  .med-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .med-usage { font-size: 12px; color: var(--grey); margin-top: 3px; }
  .med-stock { text-align: right; flex-shrink: 0; }
  .med-stock b { font-size: 20px; font-weight: 800; }
  .med-stock div { font-size: 11px; color: var(--grey); }
  .progress-wrap { height: 7px; border-radius: 20px; background: var(--track); overflow: hidden; margin-top: 14px; }
  .progress-bar { height: 100%; border-radius: 20px; transition: width .3s; }
  .med-bottom { display: flex; align-items: center; margin-top: 8px; }
  .med-min { font-size: 11px; color: var(--grey); }
  .med-flag { margin-left: auto; font-size: 11px; font-weight: 700; }
  .med-flag.warn { color: #B07400; background: var(--amber-soft); padding: 4px 10px; border-radius: 30px; }
  .med-flag.ok { color: var(--mint); }

  /* ── STOCK PAGE (staff only) ── */
  .stock-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .stock-title { font-size: 24px; font-weight: 800; }
  .stock-sub { font-size: 12px; color: var(--grey); margin-top: 4px; }
  .add-btn { width: 46px; height: 46px; border-radius: 16px; background: var(--coral); color: #fff; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: auto; }
  .add-btn svg { width: 20px; height: 20px; }
  .filter-row { display: flex; gap: 10px; margin: 16px 0 18px; }
  .filter-chip { padding: 10px 18px; border-radius: 30px; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--grey); box-shadow: var(--shadow); transition: .2s; }
  .filter-chip.active { background: var(--ink); color: var(--bg-top); box-shadow: none; }
  .empty-state { text-align: center; padding: 50px 0; color: var(--grey); font-size: 13px; }

  /* ── STAFF APPROVAL CARD ── */
  .approval-card { background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .approval-top { display: flex; align-items: center; gap: 12px; }
  .approval-avatar { width: 42px; height: 42px; border-radius: 13px; background: var(--mint-soft); color: var(--mint); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .approval-avatar svg { width: 20px; height: 20px; }
  .approval-name { font-size: 14px; font-weight: 700; }
  .approval-time { font-size: 11px; color: var(--grey); margin-top: 1px; }
  .approval-status { margin-left: auto; font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .approval-status.pending  { background: var(--amber-soft); color: #B07400; }
  .approval-status.approved { background: var(--mint-soft); color: var(--mint); }
  .approval-status.rejected { background: #FFE3E0; color: #D9483D; }
  .approval-items { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .approval-tag { font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 20px; background: var(--chip-bg); color: var(--ink); }
  .approval-actions { display: flex; gap: 10px; }
  .approval-btn { flex: 1; padding: 10px; border-radius: 13px; font-size: 12.5px; font-weight: 700; }
  .approval-btn.approve { background: var(--mint); color: #fff; }
  .approval-btn.reject { background: #FFE3E0; color: #D9483D; }

  /* ── STUDENT REQUEST FORM ── */
  .med-select-item { display: flex; align-items: center; gap: 13px; background: var(--surface); border-radius: 18px; padding: 13px 14px; margin-bottom: 9px; box-shadow: var(--shadow); cursor: pointer; border: 2px solid transparent; transition: border-color .12s; }
  .med-select-item.selected { border-color: var(--coral); }
  .med-select-check { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; }
  .med-select-check svg { width: 14px; height: 14px; display: none; }
  .med-select-item.selected .med-select-check { background: var(--coral); border-color: var(--coral); }
  .med-select-item.selected .med-select-check svg { display: block; }
  .submit-btn { width: 100%; background: var(--coral); color: #fff; padding: 15px; border-radius: 16px; font-size: 14.5px; font-weight: 700; box-shadow: var(--shadow); margin-top: 4px; }
  .my-req-card { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 10px; }
  .my-req-top { display: flex; align-items: center; }
  .my-req-time { font-size: 11px; color: var(--grey); }
  .my-req-items { font-size: 13px; font-weight: 600; margin-top: 4px; }

  /* ── PLACEHOLDER / PROFILE ── */
  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .placeholder-icon { width: 96px; height: 96px; border-radius: 32px; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; color: var(--coral); margin-bottom: 18px; }
  .placeholder-icon svg { width: 44px; height: 44px; }
  .placeholder-title { font-size: 20px; font-weight: 800; }
  .placeholder-sub { font-size: 13px; color: var(--grey); margin-top: 6px; }
  .logout-btn { margin-top: 24px; display: flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 30px; background: var(--surface); box-shadow: var(--shadow); color: var(--coral); font-size: 13px; font-weight: 700; }
  .logout-btn svg { width: 16px; height: 16px; }
  .theme-row-profile { margin-top: 14px; display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 30px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font-size: 12.5px; font-weight: 700; }
  .theme-row-profile svg { width: 15px; height: 15px; }

  /* ── BOTTOM NAV ── */
  .nav-bar { position: fixed; left: 20px; right: 20px; bottom: 22px; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow-nav); padding: 10px 8px; display: flex; justify-content: space-around; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 12px; border-radius: 18px; color: var(--grey); transition: .2s; }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn span { font-size: 10px; font-weight: 500; }
  .nav-btn.active { background: var(--coral-soft); color: var(--coral); }
  .nav-btn.active span { font-weight: 700; }

  /* ── TOAST ── */
  .toast { position: fixed; left: 20px; right: 20px; bottom: 100px; background: var(--ink); color: var(--bg-top); padding: 14px 18px; border-radius: 14px; font-size: 13px; text-align: center; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="screen-login">
  <div class="screen-topbar"><button class="theme-btn" id="loginThemeBtn" onclick="toggleTheme()"></button></div>
  <div class="login-box">
    <div class="login-logo">${ICON.pharmacy}</div>
    <div class="login-title">MediCare Station</div>
    <div class="login-sub">เข้าสู่ระบบเพื่อดำเนินการต่อ</div>
    <div class="login-role-row">
      <button class="role-toggle active" id="roleStaffBtn" onclick="setRole('staff')">เจ้าหน้าที่</button>
      <button class="role-toggle" id="roleStudentBtn" onclick="setRole('student')">นักศึกษา</button>
    </div>
    <div class="login-fields">
      <div class="field-box">${ICON.user}<input id="loginUser" placeholder="ชื่อผู้ใช้ / รหัสนักศึกษา"></div>
      <div class="field-box">
        ${ICON.lock}<input id="loginPass" type="password" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="field-eye" onclick="togglePw()" id="eyeBtn">${ICON.eye}</button>
      </div>
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-hint">ทดลองใช้: กรอกชื่อผู้ใช้และรหัสผ่านอะไรก็ได้</div>
  </div>
</div>

<!-- APP -->
<div class="screen" id="app">
  <div class="page active" id="page-home"></div>
  <div class="page" id="page-stock"></div>
  <div class="page" id="page-request"></div>
  <div class="page" id="page-profile"></div>
  <div class="nav-bar" id="navBar"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── ICONS ──
const S = 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
  pharmacy:      `<svg class="ico" viewBox="0 0 24 24" ${S}><path d="M4.5 14.5l7-7a4.95 4.95 0 117 7l-7 7a4.95 4.95 0 01-7-7z"/><line x1="9" y1="9" x2="14.5" y2="14.5"/></svg>`,
  bell:          `<svg class="ico" viewBox="0 0 24 24" ${S}><path d="M6 8a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M9.5 21a2.5 2.5 0 005 0"/></svg>`,
  search:        `<svg class="ico" viewBox="0 0 24 24" ${S}><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  plus:          `<svg class="ico" viewBox="0 0 24 24" ${S}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  arrowRight:    `<svg class="ico" viewBox="0 0 24 24" ${S}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="13,6 19,12 13,18"/></svg>`,
  warning:       `<svg class="ico" viewBox="0 0 24 24" ${S}><path d="M12 4L3 20h18L12 4z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17.01"/></svg>`,
  medkit:        `<svg class="ico" viewBox="0 0 24 24" ${S}><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="9.5" y1="13.5" x2="14.5" y2="13.5"/></svg>`,
  clipboard:     `<svg class="ico" viewBox="0 0 24 24" ${S}><rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="15" y2="15"/></svg>`,
  chart:         `<svg class="ico" viewBox="0 0 24 24" ${S}><polyline points="3,17 9,11 13,15 21,6"/><polyline points="15,6 21,6 21,12"/></svg>`,

  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  eyeBtn.innerHTML = show ? ICON.eyeOff : ICON.eye;
}
function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  if (!user || !pass) { err.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'; return; }
  err.textContent = '';
  currentUser = user;
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('app').classList.add('active');
  applyRoleUI();
}
function logout() {
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('app').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
}

// ── MEDICINE CARD ──
function medCardHTML(m) {
  return `
  <div class="med-card ${m.isLow ? 'low' : ''}" onclick="toast('รายละเอียด: ${m.name}')">
    <div class="med-top">
      <div class="med-icon" style="background:${hexA(m.color,.15)};color:${m.color}">${ICON[m.icon]}</div>
      <div style="flex:1;min-width:0"><div class="med-name">${m.name}</div><div class="med-usage">${m.usage}</div></div>
      <div class="med-stock"><b style="color:${m.isLow ? C.amber : 'var(--ink)'}">${m.stock}</b><div>ชิ้น</div></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${m.ratio*100}%;background:${m.isLow ? C.amber : m.color}"></div></div>
    <div class="med-bottom">
      <div class="med-min">ขั้นต่ำ ${m.minStock} ชิ้น</div>
      ${m.isLow ? `<div class="med-flag warn">${ICON.warning} ควรเติมสต็อก</div>` : `<div class="med-flag ok">เพียงพอ</div>`}
    </div>
  </div>`;
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

function renderFilterRow() {
  document.getElementById('filterRow').innerHTML = filterLabels.map((lbl, i) => `
    <button class="filter-chip ${stockFilter === i ? 'active' : ''}" onclick="setFilter(${i})">${lbl}</button>`).join('');

function setFilter(i) { stockFilter = i; renderFilterRow(); renderStockList(); }
function renderStockList() {
  const kw = document.getElementById('stockSearch').value.trim();
  const list = medicines.filter(m => {
    const okFilter = stockFilter === 0 || (stockFilter === 1 && m.isLow) || (stockFilter === 2 && !m.isLow);
    const okSearch = !kw || m.name.includes(kw) || m.usage.includes(kw);
    return okFilter && okSearch;
  });
  document.getElementById('stockList').innerHTML = list.length ? list.map(medCardHTML).join('') : `<div class="empty-state">ไม่พบรายการยา</div>`;
}

function toggleMedSelect(id) {
  if (selectedMedIds.has(id)) selectedMedIds.delete(id); else selectedMedIds.add(id);
  renderMedSelectList();
}
function submitRequest() {
  if (selectedMedIds.size === 0) { toast('กรุณาเลือกยาอย่างน้อย 1 รายการ'); return; }
  const items = medicines.filter(m => selectedMedIds.has(m.id)).map(m => m.name);
  myRequests.unshift({ items, time: new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) + ' น.', status: 'pending' });
  selectedMedIds.clear();
  renderMedSelectList();
  renderMyReqList();
  renderHome();
  toast('ส่งคำขอเบิกยาแล้ว');
}
function myReqCardHTML(r) {
  return `
  <div class="my-req-card">
    <div class="my-req-top">
      <div class="my-req-time">${r.time}</div>
      <div class="approval-status pending" style="margin-left:auto">รอเจ้าหน้าที่อนุมัติ</div>
    </div>
    <div class="my-req-items">${r.items.join(', ')}</div>
  </div>`;
}
function renderMyReqList() {
  document.getElementById('myReqList').innerHTML = myRequests.length ? myRequests.map(myReqCardHTML).join('') : `<div class="empty-state">ยังไม่มีคำขอเบิกยา</div>`;
}

// ── PROFILE PAGE ──
function renderProfile() {
  document.getElementById('page-profile').innerHTML = `
    <div class="placeholder">
      <div class="placeholder-icon">${currentRole === 'staff' ? ICON.user : ICON.cap}</div>
      <div class="placeholder-title">${currentUser}</div>
      <div class="placeholder-sub">${currentRole === 'staff' ? 'เจ้าหน้าที่ห้องพยาบาล' : 'นักศึกษา'}</div>
      <button class="theme-row-profile" onclick="toggleTheme()">${currentTheme === 'dark' ? ICON.sun : ICON.moon} ${currentTheme === 'dark' ? 'โหมดกลางวัน' : 'โหมดกลางคืน'}</button>
      <button class="logout-btn" onclick="logout()">${ICON.logout} ออกจากระบบ</button>
    </div>`;
}

// ── TOAST ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
